name: Deploy Craft Network to GitHub Pages

on:
  push:
    branches:
      - 0818-CraftNetworkUpdate
      - master
    paths:
      - 'react-graph-viz/**'
      - 'render.yaml'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-graph-viz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: react-graph-viz/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with production env
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          # Proxy URL only — never bake API keys into the static bundle (GitHub push protection blocks them)
          REACT_APP_LLM_PROXY_URL: ${{ vars.REACT_APP_LLM_PROXY_URL }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./react-graph-viz/build
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy Craft Network from ${{ github.sha }}'
