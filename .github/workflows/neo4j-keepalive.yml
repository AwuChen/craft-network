name: Neo4j Keep-Alive

on:
  schedule:
    # Every 30 minutes — prevents Aura Free from pausing due to inactivity
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install neo4j-driver
        working-directory: react-graph-viz
        run: npm install neo4j-driver --no-save

      - name: Ping Neo4j Aura
        working-directory: react-graph-viz
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: node scripts/neo4j-keepalive.js

      - name: Export 3D graph snapshot
        working-directory: react-graph-viz
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: node scripts/export-3d-graph.js public/graph-data.json

      - uses: actions/upload-artifact@v4
        with:
          name: graph-data
          path: react-graph-viz/public/graph-data.json
          if-no-files-found: error
